name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          # Pinned to the minor line this config was verified against, not
          # "~> v2" — that float is what turned GoReleaser's `brews:`
          # deprecation into a hard release failure mid-implementation. A
          # release pipeline that only runs on tags gets no warning before
          # it matters, so the version bump should be a deliberate commit.
          version: "~> v2.17.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
