name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -timeout 300s
      - name: THIRD_PARTY_NOTICES is up to date
        run: |
          ./scripts/gen-notices.sh /tmp/notices.check
          diff -q /tmp/notices.check THIRD_PARTY_NOTICES \
            || { echo "THIRD_PARTY_NOTICES is stale — run: make notices"; exit 1; }
