version: 2

project_name: switchboard

before:
  hooks:
    - go mod tidy

builds:
  - id: switchboard
    main: ./cmd/switchboard
    binary: switchboard
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/alsey89/switchboard/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: switchboard
    binaries:
      - switchboard
    repository:
      owner: alsey89
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/alsey89/switchboard"
    description: "Local domains with real HTTPS for web development"
    license: "Apache-2.0"
    # The binary is not notarized (see README). Casks quarantine their payload
    # by default, unlike formulae, so strip the attribute on install or
    # Gatekeeper blocks the binary outright.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/switchboard"]
          end
    # zap, not uninstall. Homebrew runs the *old* version's uninstall as part
    # of an upgrade, so a launchctl stanza there boots out the running service
    # every time anyone upgrades — password prompt included, since Homebrew
    # does escalate for a LaunchDaemon. That left a working install serving
    # nothing, with no indication until a page failed to load. zap runs only
    # on `brew uninstall --zap`.
    #
    # Leaving it out of uninstall costs less than it looks. The launch daemon
    # runs the root-owned copy in /Library/PrivilegedHelperTools, which
    # Homebrew never touches, so it keeps working after `brew uninstall` — the
    # stanza was never protecting the shape it broke. Only the agent shape
    # names the binary Homebrew unlinks, and `switchboard uninstall` removes
    # that correctly in both shapes.
    zap:
      launchctl:
        - io.github.alsey89.switchboard
    # Keep in step with README.md's quickstart. This text is a published
    # artifact: it goes into the tap and `brew install` prints it, so a
    # command named here that does not work is a broken first run for every
    # new user. See ADR 0001.
    caveats: |
      Set up once:

        switchboard setup

      That creates the local CA, points the OS resolver at Switchboard,
      trusts the CA in your login keychain, and installs the background
      service. Every step that needs your password prints the exact command
      first.

      Then:

        switchboard add app 3000  &&  open https://app.test

      It asks for a password because :443 and :80 are reserved for root on
      macOS. Switchboard installs a small parent process that binds those two
      sockets and immediately drops to your user. The proxy, the TLS stack
      and the local CA all run as you, never as root.

      Prefer nothing privileged at all? Put this in
      ~/.config/switchboard/config.toml before running setup:

        http_port  = 8080
        https_port = 8443

      You get a plain user agent instead. Everything works the same, and
      URLs carry the port (https://app.test:8443).

      To remove everything, including the privileged launch daemon:

        switchboard uninstall

      Run that before `brew uninstall`. Homebrew cannot remove the privileged
      parts on its own.

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```
    brew install alsey89/tap/switchboard
    ```
